id: always-on-03--private-workflow
name: "always-on-03 :: private workflow representation"
description: "Private workflow representation for always-on-03."
enabled: false
context_dir: ../fixtures/variants/private-workflows
inputs:
  prompt: |
    Using the accepted brief and supplied project evidence for GraphOrleons, prepare reviewable native Azure health-model configuration for the component-event journey: ingestion, saved graph state and streamed updates. Return the artifacts and a focused diff, preserving existing identities and unrelated behavior. Identify any measurement or configuration gaps that prevent a complete binding. Do not deploy the change.
  follow_up_prompts: []
  files: []
graders:
  - name: required-skill-invocation
    type: skill_invocation
    config:
      mode: any_order
      required_skills:
        - healthmodel-apply
  - name: expectation-rubric
    type: prompt
    rubric: tests/evals/waza/rubrics/always-on-03.md
    config:
      prompt: |
        Grade the assistant response against the rubric requirements.
        Return pass only if every requirement is clearly satisfied.
        Fail if any requirement is missing, contradicted, or unsupported by evidence in the response.
        
        Requirements:
        1. Produces substantive reviewable artifacts and a bounded diff, not just an authoring plan.
        2. Uses the supported native contract and the project's generation/editing conventions; configuration passes applicable structural checks.
        3. Matches entities, relationships and bindings to the accepted GraphOrleons scope and evidence.
        4. Preserves stable identities and unrelated settings.
        5. Makes missing instrumentation/bindings explicit instead of inventing a healthy measurement or silently changing the requested scope.
        6. Performs no deployment.
        7. Relevant capabilities must be discovered and invoked autonomously. Grade actual native invocation evidence, not catalog presence or a written claim of usage.
        8. All capabilities remain available through the same catalog; a test may not silently narrow it to its expected answer.
        9. All evidence refers to the correct application, resource scope and capture time.
        10. No mandatory failure can be averaged away. Infrastructure errors or unrun cases cannot pass.
        11. Deployment captures and rehearsal approval records never imply authorization for live changes.
tags:
  - source:always-on-five
  - source-id:always-on-03
  - target:GraphOrleons
  - blocked:private-workflow-capture-set-unavailable
  - blocked:safety-admission-unproven
