id: always-on-02--private-workflow
name: "always-on-02 :: private workflow representation"
description: "Private workflow representation for always-on-02."
enabled: false
context_dir: ../fixtures/variants/private-workflows
inputs:
  prompt: |
    I need to know whether HelloOrleons can return greetings and keep its per-name counter working. Using the project files and captured Azure query responses, identify the smallest useful set of observations and show the queries, scope, time windows and results that support them. Explain what the available evidence can and cannot establish, including counter persistence. Leave the deployed application unchanged.
  follow_up_prompts: []
  files: []
graders:
  - name: required-skill-invocation
    type: skill_invocation
    config:
      mode: any_order
      required_skills:
        - healthmodel-apply
  - name: expectation-rubric
    type: prompt
    rubric: tests/evals/waza/rubrics/always-on-02.md
    config:
      prompt: |
        Grade the assistant response against the rubric requirements.
        Return pass only if every requirement is clearly satisfied.
        Fail if any requirement is missing, contradicted, or unsupported by evidence in the response.
        
        Requirements:
        1. Uses actual available instrumentation or explicitly identifies a missing measurement; invents no counter metric.
        2. Identifies query/source/scope/window and relevant units or dimensions, with claims matching the recorded responses.
        3. Distinguishes numeric zero from absent, failed, partial or stale evidence when those conditions occur.
        4. Does not infer working business behavior or persistent counters solely from `/health` or infrastructure availability.
        5. Does not treat the greeting route as a side-effect-free probe: its implementation increments state.
        6. Relevant capabilities must be discovered and invoked autonomously. Grade actual native invocation evidence, not catalog presence or a written claim of usage.
        7. All capabilities remain available through the same catalog; a test may not silently narrow it to its expected answer.
        8. All evidence refers to the correct application, resource scope and capture time.
        9. No mandatory failure can be averaged away. Infrastructure errors or unrun cases cannot pass.
        10. Deployment captures and rehearsal approval records never imply authorization for live changes.
tags:
  - source:always-on-five
  - source-id:always-on-02
  - target:HelloOrleons
  - blocked:private-workflow-capture-set-unavailable
  - blocked:safety-admission-unproven
